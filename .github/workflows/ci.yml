name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.7"
          python-version: ${{ matrix.python }}
      - name: Install the package from the lockfile
        run: uv sync --locked --all-extras
      - name: Lint and format checks
        run: |
          uv run --locked ruff check src tests scripts examples
          uv run --locked ruff format --check src tests scripts examples
      - name: Runtime and extracted provider tests
        run: uv run --locked pytest -q
      - name: Offline examples
        run: |
          uv run --locked python scripts/simulate_gemini.py examples/basic.py
          uv run --locked python scripts/simulate_gemini.py examples/analysis_with_cleaner.py
      - name: Build distributions
        run: uv build --no-sources
      - name: Verify archives and isolated wheel installation
        run: uv run --locked python scripts/check_distribution.py
