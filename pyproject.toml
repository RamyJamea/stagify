[project]
name = "stagify"
version = "0.1.0a0"
description = "A Python framework for staged tool workflows with explicit context policies."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RamyJamea" }]
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/RamyJamea/stagify"
Issues = "https://github.com/RamyJamea/stagify/issues"

[build-system]
requires = ["uv_build>=0.9.7,<0.10"]
build-backend = "uv_build"
