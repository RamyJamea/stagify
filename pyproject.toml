[project]
name = "stagify"
version = "0.1.2"
description = "A Python framework for staged tool workflows with explicit context policies."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RamyJamea" }]
dependencies = [
    "pydantic>=2.12,<3",
    "structlog>=25,<27",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://ramyjamea.github.io/stagify/"
Repository = "https://github.com/RamyJamea/stagify"
Issues = "https://github.com/RamyJamea/stagify/issues"

[project.optional-dependencies]
google = [
    "google-genai>=2.28,<3",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=1.0.8,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/stagify/nlp", "tests/test_interactions_extracted.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["UP046"]

[tool.pytest.ini_options]
testpaths = ["tests"]
